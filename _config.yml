# Blog
# Posts live in _posts/ as YYYY-MM-DD-title.md and are served at /blog/YEAR/title/.
# Drafts live in _drafts/ (no date in the filename); they show in the local preview only.
plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: blog/feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:year/:title/

# The following files will be removed from the generated website.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - LICENSE
  - minimal-light.gemspec
  - docker-compose.yml
  - vendor/

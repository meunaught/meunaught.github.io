# Local preview without installing Ruby: `docker compose up`, then open http://localhost:4000
# Drafts in _drafts/ are shown here but never on the live site.
services:
  jekyll:
    image: ruby:3.3
    working_dir: /srv/site
    command: sh -c "bundle install && bundle exec jekyll serve --host 0.0.0.0 --drafts --livereload --force_polling"
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/site
      - bundle:/usr/local/bundle

volumes:
  bundle:

{%- if site.posts.size > 0 -%}
<h2 id="blog">Recent Posts</h2>
<ul class="post-list">
{%- for post in site.posts limit: 3 %}
<li><span class="post-date">{{ post.date | date: "%b %-d, %Y" }}</span><a class="post-link" href="{{ post.url | relative_url }}">{{ post.title }}</a></li>
{%- endfor %}
</ul>
<p><a href="{{ '/blog/' | relative_url }}">All posts &rarr;</a></p>
{%- endif -%}
